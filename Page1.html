<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1 - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="Page1.html">Home</a></li>
                <li><a href="Page2.html">Gallery</a></li>
                <li><a href="Page3.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>My Details</h1>
        
        
        <form id="detailsForm" onsubmit="return validateForm(event)">
            <label for="department">Department:</label><br>
            <select id="department" name="department">
                <option value="ICT">ICT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
            </select><br><br>

            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" placeholder="Adam"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="12Abcde"><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 GFH BANK</p>
    </footer>

    
    <script>
        function validateForm(event) {
            event.preventDefault(); // Prevent form from submitting normally for this test
            let username = document.getElementById("username").value;
            
            if (username.trim() === "") {
                alert("Username field cannot be empty!");
                return false;
            }
            
            alert("Form submitted successfully with Username: " + username);
            return true;
        }
    </script>
</body>
</html>
